version: "3.8"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "10"
    compress: "true"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trottistore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trottistore}
      POSTGRES_USER: ${POSTGRES_USER:-trottistore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trottistore} -d ${POSTGRES_DB:-trottistore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: trottistore-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 900 1 --save 300 10 --save 60 10000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - internal

  ecommerce:
    build:
      context: .
      dockerfile: services/ecommerce/Dockerfile
    container_name: trottistore-ecommerce
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - internal

  crm:
    build:
      context: .
      dockerfile: services/crm/Dockerfile
    container_name: trottistore-crm
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - internal

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    container_name: trottistore-analytics
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - internal

  sav:
    build:
      context: .
      dockerfile: services/sav/Dockerfile
    container_name: trottistore-sav
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # next.config.ts rewrites() and NEXT_PUBLIC_* are baked in at `next build`:
      # env_file at runtime is too late. Inside the compose network the backends
      # are reachable by service name, not localhost.
      args:
        API_URL: http://ecommerce:3001
        API_CRM_URL: http://crm:3002
        API_SAV_URL: http://sav:3004
        API_ANALYTICS_URL: http://analytics:3003
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    container_name: trottistore-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      ecommerce:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: trottistore-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - ecommerce
      - crm
      - analytics
      - sav
    logging: *default-logging
    networks:
      - internal

  backup:
    image: postgres:16-alpine
    container_name: trottistore-backup
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Backup cron started"
        while true; do
          sleep 21600  # Every 6 hours
          echo "[$(date)] Running database backup..."
          out="/backups/trottistore_$$(date +%Y%m%d_%H%M%S).sql.gz"
          # Write to a temp file first; only publish it if pg_dump AND gzip succeeded
          # and the archive is non-trivial. A refused connection must not become
          # an empty .sql.gz followed by "Backup complete".
          set -o pipefail
          if PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -h postgres -U "$${POSTGRES_USER:-trottistore}" "$${POSTGRES_DB:-trottistore}" | gzip > "$$out.tmp" \
             && [ "$$(stat -c %s "$$out.tmp")" -gt 1024 ] && gzip -t "$$out.tmp"; then
            mv "$$out.tmp" "$$out"
            # Cleanup backups older than 30 days — only after a successful new one
            find /backups -name "trottistore_*.sql.gz" -mtime +30 -delete
            echo "[$(date)] Backup complete: $$out ($$(stat -c %s "$$out") bytes)"
          else
            rm -f "$$out.tmp"
            echo "[$(date)] BACKUP FAILED — pg_dump/gzip error or empty archive" >&2
          fi
        done
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trottistore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-trottistore}
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  backup_data:

networks:
  internal:
    driver: bridge
