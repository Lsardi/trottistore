name: CI — TrottiStore Platform

on:
  push:
    branches: [main, develop]
  # Any PR, whatever its base: stacked PRs (agent branches targeting another
  # agent branch) must get the same checks as PRs to main.
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  # ─────────────────────────────────────────────
  # Lint & Type Check
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @trottistore/database db:generate

      - name: Type check all packages
        run: |
          pnpm --filter @trottistore/web lint
          pnpm --filter @trottistore/database lint
          pnpm --filter @trottistore/shared lint
          pnpm --filter @trottistore/ui lint
          pnpm --filter @trottistore/service-ecommerce lint
          pnpm --filter @trottistore/service-crm lint
          pnpm --filter @trottistore/service-sav lint
          pnpm --filter @trottistore/service-analytics lint

  # ─────────────────────────────────────────────
  # Build
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @trottistore/database db:generate

      - name: Build all packages
        run: pnpm build

  # ─────────────────────────────────────────────
  # Docker Build (services)
  # ─────────────────────────────────────────────
  docker:
    name: Docker Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        service: [ecommerce, crm, analytics, sav]
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -f services/${{ matrix.service }}/Dockerfile \
            -t trottistore/${{ matrix.service }}:${{ github.sha }} \
            .

  # ─────────────────────────────────────────────
  # Database Schema Validation
  # ─────────────────────────────────────────────
  db-validate:
    name: Validate Prisma Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        # NOTE: For production CD pipeline, use `pnpm db:deploy` (prisma migrate deploy)
        # instead of `db:push` to apply migrations safely and reproducibly.
        run: pnpm --filter @trottistore/database exec prisma validate

      - name: Generate Prisma Client (verify generation works)
        run: pnpm --filter @trottistore/database db:generate

  # ─────────────────────────────────────────────
  # Unit Tests
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trottistore/database db:generate
      - run: pnpm test -- --coverage

  # ─────────────────────────────────────────────
  # Smoke Tests (critical release flows)
  # ─────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trottistore/database db:generate
      - run: pnpm test:smoke

  # ─────────────────────────────────────────────
  # Security Scan
  # ─────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ─────────────────────────────────────────────
  # E2E Tests (PRs to main only)
  # ─────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: false
    timeout-minutes: 25
    # The storefront proxies /api/v1/* to the four backends; without them every
    # page that touches the cart or auth fails with ECONNREFUSED. Bring up real
    # Postgres + Redis, migrate, seed the demo accounts the specs log in with
    # (admin@demo.fr, client1@demo.fr) and start the services before Playwright.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trottistore_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/trottistore_e2e
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: e2e-access-secret-not-for-production-0123456789abcdef
      JWT_REFRESH_SECRET: e2e-refresh-secret-not-for-production-0123456789abcdef
      COOKIE_SECRET: e2e-cookie-secret-not-for-production-0123456789abcdef
      API_URL: http://localhost:3001
      API_CRM_URL: http://localhost:3002
      API_ANALYTICS_URL: http://localhost:3003
      API_SAV_URL: http://localhost:3004
      NODE_ENV: test
      ORDER_EXPIRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trottistore/database db:generate
      - name: Migrate + seed demo data
        run: |
          pnpm --filter @trottistore/database exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm db:seed:demo
      - run: pnpm build
      - name: Start backend services
        run: |
          for svc in ecommerce crm analytics sav; do
            (pnpm --filter @trottistore/service-$svc start > "/tmp/$svc.log" 2>&1 &)
          done
          for port in 3001 3002 3003 3004; do
            for i in $(seq 1 30); do
              curl -sf "http://localhost:$port/health" >/dev/null && break
              sleep 2
              if [ "$i" = 30 ]; then
                echo "::error::service on :$port did not become healthy"; cat /tmp/*.log; exit 1
              fi
            done
          done
          echo "All backends healthy"
      - name: Install Playwright browsers
        run: pnpm --filter @trottistore/web exec playwright install --with-deps chromium webkit
      - name: Run E2E tests
        run: pnpm --filter @trottistore/web test:e2e
      - name: Backend logs on failure
        if: failure()
        run: tail -n 100 /tmp/*.log
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 14

  # ─────────────────────────────────────────────
  # Final CI Gate
  # ─────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - lint
      - build
      - unit-tests
      - db-validate
      - security-scan
      - smoke-tests
      - docker
      - e2e-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "CI failed"
            exit 1
          fi
